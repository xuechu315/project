<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>系统操作日志 - 管理后台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<script src="../js/auth.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">

<aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0">
  <div class="p-6 flex items-center gap-3">
    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-100">
      <iconify-icon class="text-2xl" icon="solar:health-bold"></iconify-icon>
    </div>
    <div class="flex flex-col leading-tight">
      <span class="text-lg font-bold text-slate-800">多银龄守护系统</span>
      <span class="text-xs font-semibold text-blue-600">管理员中心</span>
    </div>
  </div>
  <nav class="flex-1 px-4 space-y-1 overflow-y-auto mt-4">
    <div class="pt-8 pb-4">
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">系统管理</p>
    </div>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-800 rounded-xl transition-all" href="admin_user_management.html">
      <iconify-icon class="text-xl" icon="solar:users-group-rounded-bold"></iconify-icon>
      <span>用户管理</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-800 rounded-xl transition-all" href="admin_user_pairs.html">
      <iconify-icon class="text-xl" icon="solar:link-bold"></iconify-icon>
      <span>用户关系配对</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-xl font-bold" href="admin_operation_logs.html">
      <iconify-icon class="text-xl" icon="solar:document-bold"></iconify-icon>
      <span>系统操作日志</span>
    </a>
  </nav>
  <div class="p-4 border-t border-slate-100">
    <a class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition-all" href="#" onclick="UserAuth.logout(); return false;">
      <iconify-icon class="text-xl" icon="solar:logout-bold"></iconify-icon>
      <span class="font-semibold">退出系统</span>
    </a>
  </div>
</aside>
<main class="flex-1 overflow-y-auto">
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-100 px-8 py-4 flex items-center justify-between">
    <h2 class="text-xl font-bold">系统操作日志</h2>
    <div class="flex items-center gap-4">
      <button class="px-4 py-2 bg-white border rounded-xl" onclick="clearLogs()">清空日志</button>
    </div>
  </header>
  <div class="p-8 space-y-6">
    <section class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
      <div class="flex items-center gap-3 mb-4">
        <input id="search-log" class="px-3 py-2 border rounded-lg flex-1" placeholder="按用户/操作/时间检索" />
        <select id="level-filter" class="px-3 py-2 border rounded-lg">
          <option value="all">全部类型</option>
          <option value="info">信息</option>
          <option value="warn">警告</option>
          <option value="error">错误</option>
        </select>
      </div>
      <div id="logs-list" class="max-h-[60vh] overflow-auto text-sm text-slate-700">
        <!-- 日志条目由 JS 渲染 -->
      </div>
      <div id="logs-empty" class="text-center text-slate-400 py-12 hidden">暂无操作日志</div>
    </section>
  </div>
</main>

<script>
  const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('admin_channel') : null;

  const API_BASE = 'http://localhost:8080';
  function apiFetch(url, options){
    const opts = Object.assign({}, options);
    if (!opts.method || opts.method === 'GET') {
      opts.headers = Object.assign({}, opts.headers);
    } else {
      opts.headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers);
    }
    return fetch(API_BASE + url, opts).then(r=>r.json());
  }

  // 欢迎弹窗（仅显示一次）
  function showWelcome(){
    if(sessionStorage.getItem('admin_welcome_shown')) return;
    const modal = document.createElement('div');
    modal.className = 'fixed inset-0 flex items-center justify-center bg-black/40 z-50';
    modal.innerHTML = `<div class="bg-white p-6 rounded-2xl max-w-lg text-center">
      <h3 class="text-xl font-bold mb-2">欢迎，管理员</h3>
      <p class="text-sm text-slate-600 mb-4">查看系统操作日志可以审计管理员操作。</p>
      <button class="px-4 py-2 bg-blue-600 text-white rounded-xl" id="welcome-ok">开始使用</button>
    </div>`;
    document.body.appendChild(modal);
    document.getElementById('welcome-ok').addEventListener('click', ()=>{ sessionStorage.setItem('admin_welcome_shown','1'); modal.remove(); });
  }

  function loadLogs(){
    apiFetch('/api/admin/logs')
      .then(res => {
        if(res.code !== 200) throw new Error(res.message || '获取日志失败');
        renderLogs(res.data || []);
      }).catch(err => { document.getElementById('logs-list').innerHTML = ''; document.getElementById('logs-empty').classList.remove('hidden'); });
  }

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderLogs(logs){
    const list = document.getElementById('logs-list');
    const empty = document.getElementById('logs-empty');
    const q = document.getElementById('search-log').value.toLowerCase();
    const level = document.getElementById('level-filter').value;
    const filtered = logs.filter(l => {
      if(level !== 'all' && (l.level||'info') !== level) return false;
      const searchText = (l.operator||'') + ' ' + (l.operation||'') + ' ' + (l.createdAt||'');
      return (!q) || searchText.toLowerCase().includes(q);
    });
    if(filtered.length === 0){ list.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    list.innerHTML = filtered.map(l=>{
      const t = new Date(l.createdAt).toLocaleString();
      return `<div class="p-3 border-b"><div class="flex items-center gap-3"><span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${esc(l.operator)}</span><span class="text-sm">${esc(l.operation)}</span></div><div class="text-[12px] text-slate-400 mt-1">${t}</div></div>`;
    }).join('');
  }

  document.getElementById('search-log').addEventListener('input', ()=> loadLogs());
  document.getElementById('level-filter').addEventListener('change', ()=> loadLogs());

  function clearLogs(){
    if(!confirm('确定清空所有日志？')) return;
    apiFetch('/api/admin/logs', { method: 'DELETE' })
      .then(res => { if(res.code === 200){ if(channel) channel.postMessage({type:'logsCleared'}); loadLogs(); } else throw new Error(res.message); })
      .catch(err => alert('清空失败: ' + err.message));
  }

  function broadcast(msg){ try{ if(channel) channel.postMessage(msg); } catch(e){} }

  if(channel){
    channel.onmessage = (ev)=>{
      if(ev.data && ev.data.type === 'log'){
        loadLogs();
      }
      if(ev.data && ev.data.type === 'logsCleared'){
        loadLogs();
      }
    }
  }

  window.addEventListener('DOMContentLoaded', ()=>{
    UserAuth.requireAuth(['admin']);
    loadLogs();
    showWelcome();
  });
</script>
</body>
</html>
