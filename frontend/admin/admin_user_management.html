<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>用户管理 - 管理后台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<script src="../js/auth.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">

<!-- 侧边导航 -->
<aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0">
  <div class="p-6 flex items-center gap-3">
    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-100">
      <iconify-icon class="text-2xl" icon="solar:health-bold"></iconify-icon>
    </div>
    <div class="flex flex-col leading-tight">
      <span class="text-lg font-bold text-slate-800">多银龄守护系统</span>
      <span class="text-xs font-semibold text-blue-600">管理员中心</span>
    </div>
  </div>
  <nav class="flex-1 px-4 space-y-1 overflow-y-auto mt-4">
    <div class="pt-8 pb-4">
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">系统管理</p>
    </div>
    <a class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-xl font-bold" href="admin_user_management.html">
      <iconify-icon class="text-xl" icon="solar:users-group-rounded-bold"></iconify-icon>
      <span>用户管理</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-800 rounded-xl transition-all" href="admin_user_pairs.html">
      <iconify-icon class="text-xl" icon="solar:link-bold"></iconify-icon>
      <span>用户关系配对</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-800 rounded-xl transition-all" href="admin_operation_logs.html">
      <iconify-icon class="text-xl" icon="solar:document-bold"></iconify-icon>
      <span>系统操作日志</span>
    </a>
  </nav>
  <div class="p-4 border-t border-slate-100">
    <a class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition-all" href="#" onclick="UserAuth.logout(); return false;">
      <iconify-icon class="text-xl" icon="solar:logout-bold"></iconify-icon>
      <span class="font-semibold">退出系统</span>
    </a>
  </div>
</aside>

<!-- 主内容区 -->
<main class="flex-1 overflow-y-auto">
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-100 px-8 py-4 flex items-center justify-between">
    <h2 class="text-xl font-bold"><iconify-icon icon="solar:users-group-rounded-bold" class="text-2xl mr-2 align-middle"></iconify-icon>用户管理</h2>
    <button id="btn-add-user" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all flex items-center gap-2">
      <iconify-icon icon="solar:user-plus-bold"></iconify-icon>
      <span>新增用户</span>
    </button>
  </header>

  <div class="p-8">
    <!-- 用户列表表格 -->
    <section class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <div class="flex items-center gap-3 px-6 py-4 border-b border-slate-100">
        <input id="user-search-input" class="px-3 py-2 border rounded-lg w-64 text-sm" placeholder="搜索用户名 / 姓名 / 角色 / 手机号" />
        <button id="user-search-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">搜索</button>
        <button id="user-search-clear" class="px-4 py-2 border rounded-lg hover:bg-slate-50 text-sm hidden">显示全部</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
            <tr>
              <th class="px-6 py-4 font-semibold">用户名</th>
              <th class="px-6 py-4 font-semibold">姓名</th>
              <th class="px-6 py-4 font-semibold">角色</th>
              <th class="px-6 py-4 font-semibold">手机号</th>
              <th class="px-6 py-4 font-semibold">创建时间</th>
              <th class="px-6 py-4 font-semibold text-center">操作</th>
            </tr>
          </thead>
          <tbody id="user-table-body" class="divide-y divide-slate-100">
            <tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div id="table-pagination" class="hidden flex items-center justify-between px-6 py-3 border-t border-slate-100 bg-slate-50 text-sm">
        <div class="text-slate-500">共 <span id="total-count">0</span> 条</div>
        <div class="flex items-center gap-2">
          <button id="page-prev" class="px-3 py-1 rounded-lg border hover:bg-white disabled:opacity-40 disabled:cursor-not-allowed" disabled>上一页</button>
          <span class="text-slate-600">第 <span id="page-current">1</span> / <span id="page-total">1</span> 页</span>
          <button id="page-next" class="px-3 py-1 rounded-lg border hover:bg-white disabled:opacity-40 disabled:cursor-not-allowed" disabled>下一页</button>
          <select id="page-size" class="ml-2 px-2 py-1 border rounded-lg text-xs">
            <option value="10">10条/页</option>
            <option value="20">20条/页</option>
            <option value="50">50条/页</option>
          </select>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- 新增 / 编辑用户弹窗 -->
<div id="user-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-6 border-b border-slate-100">
      <h3 id="modal-title" class="text-lg font-bold">新增用户</h3>
      <button id="btn-close-modal" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition-all">
        <iconify-icon icon="solar:close-circle-bold" class="text-xl text-slate-400"></iconify-icon>
      </button>
    </div>
    <form id="user-form" class="p-6 space-y-4">
      <input type="hidden" id="form-edit-id" value=""/>
      <input type="hidden" id="form-elder-id" value=""/>
      <div>
        <label class="block text-sm text-slate-500 mb-1">角色 <span class="text-red-400">*</span></label>
        <select id="form-role" class="w-full px-3 py-2 border rounded-lg" required>
          <option value="elder">老人</option>
          <option value="family">家属</option>
          <option value="doctor">医生</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-slate-500 mb-1">姓名 <span class="text-red-400">*</span></label>
        <input id="form-name" class="w-full px-3 py-2 border rounded-lg" placeholder="输入姓名" required/>
      </div>
      <div>
        <label class="block text-sm text-slate-500 mb-1">用户名 <span class="text-red-400">*</span></label>
        <input id="form-username" class="w-full px-3 py-2 border rounded-lg" placeholder="登录用户名" required/>
      </div>
      <div>
        <label class="block text-sm text-slate-500 mb-1">密码 <span id="pwd-required" class="text-red-400">*</span></label>
        <input id="form-password" type="password" class="w-full px-3 py-2 border rounded-lg" placeholder="登录密码（编辑时留空则不改）"/>
      </div>
      <div>
        <label class="block text-sm text-slate-500 mb-1">手机号</label>
        <input id="form-phone" class="w-full px-3 py-2 border rounded-lg" placeholder="输入手机号"/>
      </div>
      <div id="form-additional-fields"></div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" id="btn-cancel" class="px-4 py-2 border rounded-xl text-slate-600 hover:bg-slate-50 transition-all">取消</button>
        <button type="submit" id="btn-submit" class="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all">创建账号</button>
      </div>
    </form>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div id="delete-modal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center hidden">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 text-center">
    <iconify-icon icon="solar:danger-triangle-bold" class="text-4xl text-red-500 mb-3"></iconify-icon>
    <h3 class="text-lg font-bold mb-2">确认删除</h3>
    <p class="text-sm text-slate-500 mb-6">确定要删除用户 <span id="delete-username" class="font-semibold text-slate-800"></span> 吗？此操作不可撤销。</p>
    <div class="flex justify-center gap-3">
      <button id="btn-cancel-delete" class="px-4 py-2 border rounded-xl text-slate-600 hover:bg-slate-50 transition-all">取消</button>
      <button id="btn-confirm-delete" class="px-4 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-all">确认删除</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:8080';

function apiFetch(url, options) {
  const opts = Object.assign({}, options);
  if (!opts.method || opts.method === 'GET') {
    // GET 请求不加 Content-Type，避免触发 CORS 预检
    opts.headers = Object.assign({}, opts.headers);
  } else {
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers);
  }
  return fetch(API_BASE + url, opts).then(r => r.json());
}

// ==================== 分页状态 ====================
let allUsers = [];
let filteredUsers = [];
let userPage = 1;
let userPageSize = 10;

// ==================== 加载用户列表 ====================
async function loadUsers() {
  try {
    const res = await apiFetch('/api/users');
    if (!res || res.code !== 200) throw new Error(res?.message || '加载失败');
    allUsers = res.data || [];
    filteredUsers = allUsers;
    userPage = 1;
    document.getElementById('user-search-input').value = '';
    document.getElementById('user-search-clear').classList.add('hidden');
    renderUserTable();
  } catch (err) {
    document.getElementById('user-table-body').innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-red-400">加载失败: ' + esc(err.message) + '</td></tr>';
    document.getElementById('table-pagination').classList.add('hidden');
  }
}

function renderUserTable() {
  const tbody = document.getElementById('user-table-body');
  const pagination = document.getElementById('table-pagination');
  const data = filteredUsers;
  const total = data.length;
  if (total === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400">暂无用户数据</td></tr>';
    pagination.classList.add('hidden');
    return;
  }
  const start = (userPage - 1) * userPageSize;
  const pageUsers = data.slice(start, start + userPageSize);
  const totalPages = Math.ceil(total / userPageSize);
  document.getElementById('total-count').textContent = total;
  document.getElementById('page-current').textContent = userPage;
  document.getElementById('page-total').textContent = totalPages;
  document.getElementById('page-prev').disabled = userPage <= 1;
  document.getElementById('page-next').disabled = userPage >= totalPages;
  pagination.classList.remove('hidden');

  const roleBadge = {
    admin: 'bg-purple-100 text-purple-700',
    elder: 'bg-amber-100 text-amber-700',
    family: 'bg-emerald-100 text-emerald-700',
    doctor: 'bg-sky-100 text-sky-700'
  };
  tbody.innerHTML = pageUsers.map(u => `
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="px-6 py-4 font-medium">${esc(u.username)}</td>
      <td class="px-6 py-4">${esc(u.name || '-')}</td>
      <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ${roleBadge[u.userType] || 'bg-slate-100 text-slate-600'}">${esc(u.userTypeDesc || u.userType)}</span></td>
      <td class="px-6 py-4">${esc(u.phone || '-')}</td>
      <td class="px-6 py-4 text-slate-400 text-xs">${u.createdAt ? u.createdAt.substring(0, 10) : '-'}</td>
      <td class="px-6 py-4 text-center">
        <button class="px-3 py-1.5 text-xs bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-all mr-1" onclick="openEdit(${u.id})">
          <iconify-icon icon="solar:pen-bold" class="align-middle mr-1"></iconify-icon>编辑
        </button>
        <button class="px-3 py-1.5 text-xs bg-red-50 text-red-500 rounded-lg hover:bg-red-100 transition-all" onclick="openDelete(${u.id}, '${esc(u.username)}')">
          <iconify-icon icon="solar:trash-bin-trash-bold" class="align-middle mr-1"></iconify-icon>删除
        </button>
      </td>
    </tr>
  `).join('');
}

function doUserSearch(){
  const keyword = document.getElementById('user-search-input').value.trim().toLowerCase();
  if (!keyword) {
    filteredUsers = allUsers;
    document.getElementById('user-search-clear').classList.add('hidden');
  } else {
    const roleMap = { '老人':'elder', '家属':'family', '医生':'doctor', '管理员':'admin' };
    filteredUsers = allUsers.filter(u => {
      return (u.username && u.username.toLowerCase().includes(keyword))
          || (u.name && u.name.toLowerCase().includes(keyword))
          || (u.userTypeDesc && u.userTypeDesc.includes(keyword))
          || (u.phone && u.phone.includes(keyword))
          || (u.userType && u.userType.includes(keyword))
          || (roleMap[keyword] && u.userType === roleMap[keyword]);
    });
    document.getElementById('user-search-clear').classList.remove('hidden');
  }
  userPage = 1;
  renderUserTable();
}

function clearUserSearch(){
  document.getElementById('user-search-input').value = '';
  filteredUsers = allUsers;
  document.getElementById('user-search-clear').classList.add('hidden');
  userPage = 1;
  renderUserTable();
}

function goToUserPage(page) {
  const totalPages = Math.ceil(filteredUsers.length / userPageSize);
  if (page < 1 || page > totalPages) return;
  userPage = page;
  renderUserTable();
}

document.getElementById('user-search-btn').addEventListener('click', doUserSearch);
document.getElementById('user-search-clear').addEventListener('click', clearUserSearch);
document.getElementById('user-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doUserSearch(); });
document.getElementById('page-prev').addEventListener('click', () => goToUserPage(userPage - 1));
document.getElementById('page-next').addEventListener('click', () => goToUserPage(userPage + 1));
document.getElementById('page-size').addEventListener('change', function() {
  userPageSize = Number(this.value);
  userPage = 1;
  renderUserTable();
});

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ==================== 弹窗控制 ====================
const modal = document.getElementById('user-modal');
const deleteModal = document.getElementById('delete-modal');

function showModal() { modal.classList.remove('hidden'); }
function hideModal() { modal.classList.add('hidden'); resetForm(); }
function showDeleteModal() { deleteModal.classList.remove('hidden'); }
function hideDeleteModal() { deleteModal.classList.add('hidden'); }

function resetForm() {
  document.getElementById('user-form').reset();
  document.getElementById('form-edit-id').value = '';
  document.getElementById('form-elder-id').value = '';
  document.getElementById('modal-title').textContent = '新增用户';
  document.getElementById('btn-submit').textContent = '创建账号';
  document.getElementById('pwd-required').classList.remove('hidden');
  document.getElementById('form-password').required = true;
  document.getElementById('form-additional-fields').innerHTML = '';
}

// ==================== 角色附加字段 ====================
async function renderAdditionalFields(role) {
  const container = document.getElementById('form-additional-fields');
  if (role === 'elder') {
    container.innerHTML = `
      <label class="block text-sm text-slate-500 mb-1">绑定家属（可多选）</label>
      <div id="form-family-list" class="max-h-40 overflow-y-auto border rounded-lg p-2 space-y-1 mb-3">
        <div class="text-slate-400 text-sm">加载中...</div>
      </div>
      <label class="block text-sm text-slate-500 mb-1">选择医生</label>
      <select id="form-doctor" class="w-full px-3 py-2 border rounded-lg"><option value="">不选</option></select>
    `;
    try {
      const famRes = await apiFetch('/api/family-members');
      const docRes = await apiFetch('/api/doctors');
      const families = famRes.code === 200 ? famRes.data : [];
      const docs = docRes.code === 200 ? docRes.data : [];
      const uniqueFams = families.filter((f, i, arr) => arr.findIndex(x => x.userId === f.userId) === i);
      const famListDiv = document.getElementById('form-family-list');
      if (uniqueFams.length === 0) {
        famListDiv.innerHTML = '<div class="text-slate-400 text-sm">暂无家属用户</div>';
      } else {
        famListDiv.innerHTML = uniqueFams.map(f => `<label class="flex items-center gap-2 px-2 py-1 rounded hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" class="family-elder-checkbox" value="${f.userId}">
          <span>${f.name}</span>
        </label>`).join('');
      }
      document.getElementById('form-doctor').innerHTML = '<option value="">不选</option>' + docs.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    } catch (e) { console.warn(e); }
  } else if (role === 'family') {
    try {
      const elderRes = await apiFetch('/api/elders');
      const elders = elderRes.code === 200 ? elderRes.data : [];
      container.innerHTML = `
        <label class="block text-sm text-slate-500 mb-1">关联老人（可多选）</label>
        <div id="form-elder-list" class="max-h-40 overflow-y-auto border rounded-lg p-2 space-y-1">
          ${elders.length === 0 ? '<div class="text-slate-400 text-sm">暂无老人用户</div>' : elders.map(e => `<label class="flex items-center gap-2 px-2 py-1 rounded hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" class="family-elder-checkbox" value="${e.id}">
            <span>${e.name}</span>
          </label>`).join('')}
        </div>
      `;
    } catch (e) { container.innerHTML = ''; }
  } else {
    container.innerHTML = '';
  }
}

document.getElementById('form-role').addEventListener('change', e => renderAdditionalFields(e.target.value));

// ==================== 新增 / 编辑提交 ====================
document.getElementById('user-form').addEventListener('submit', async e => {
  e.preventDefault();
  const editId = document.getElementById('form-edit-id').value;
  const role = document.getElementById('form-role').value;
  const name = document.getElementById('form-name').value.trim();
  const username = document.getElementById('form-username').value.trim();
  const password = document.getElementById('form-password').value;
  const phone = document.getElementById('form-phone').value.trim();
  if (!name) return alert('请输入姓名');
  if (!username) return alert('请输入用户名');
  if (!editId && !password) return alert('请输入密码');

  const payload = { role, username, name, phone };
  if (password) payload.password = password;
  if (role === 'family') {
    const elderCheckboxes = document.querySelectorAll('#form-elder-list input[type="checkbox"]:checked');
    const elderIds = Array.from(elderCheckboxes).map(cb => Number(cb.value));
    if (elderIds.length > 0) payload.elderIds = elderIds;
  }
  if (role === 'elder') { payload.age = null; payload.gender = null; payload.bloodType = null; }

  try {
    let res;
    if (editId) {
      res = await apiFetch('/api/users/' + editId, { method: 'PUT', body: JSON.stringify(payload) });
    } else {
      res = await apiFetch('/api/users', { method: 'POST', body: JSON.stringify(payload) });
    }
    if (!res || res.code !== 200) throw new Error(res?.message || '操作失败');
    // ===== 新增老人时同步家属/医生绑定 =====
    if (!editId && role === 'elder') {
      const newUserId = res.data?.id || res.data?.userId;
      if (newUserId) {
        const [famRes, eldersRes] = await Promise.all([
          apiFetch('/api/family-members'),
          apiFetch('/api/elders')
        ]);
        const allFamilies = (famRes.code === 200 ? famRes.data : []);
        const newElder = (eldersRes.code === 200 ? eldersRes.data.find(e => e.userId === newUserId) : null);
        if (newElder) {
          const elderId = newElder.id;
          const checkedFamUserIds = Array.from(document.querySelectorAll('#form-family-list input[type="checkbox"]:checked')).map(cb => Number(cb.value));
          for (const userId of checkedFamUserIds) {
            const famPerson = allFamilies.find(f => f.userId === userId);
            if (famPerson) {
              await apiFetch('/api/family-members', {
                method: 'POST',
                body: JSON.stringify({ userId, elderId, name: famPerson.name, phone: famPerson.phone || '' })
              });
            }
          }
          const selectedDoctorId = document.getElementById('form-doctor')?.value;
          if (selectedDoctorId) {
            await apiFetch('/api/elder-doctor', {
              method: 'POST',
              body: JSON.stringify({ elderId, doctorId: Number(selectedDoctorId) })
            });
          }
        }
      }
    }
    // 编辑老人时同步家属/医生关系（支持多家属绑定）
    if (editId && role === 'elder') {
      const elderId = Number(document.getElementById('form-elder-id').value);
      const selectedDoctorId = document.getElementById('form-doctor')?.value;
      if (elderId) {
        // 同步家属绑定（差异比较）
        const checkedFamUserIds = Array.from(document.querySelectorAll('#form-family-list input[type="checkbox"]:checked')).map(cb => Number(cb.value));
        const famList = await apiFetch('/api/family-members').then(r => r.code === 200 ? r.data : []);
        const oldBound = famList.filter(f => f.elderId === elderId);

        // 新勾选且之前未绑定 → POST 创建新行
        for (const userId of checkedFamUserIds) {
          if (!oldBound.some(f => f.userId === userId)) {
            const famPerson = famList.find(f => f.userId === userId);
            if (famPerson) {
              await apiFetch('/api/family-members', {
                method: 'POST',
                body: JSON.stringify({ userId, elderId, name: famPerson.name, phone: famPerson.phone || '' })
              });
            }
          }
        }
        // 取消勾选且之前已绑定 → DELETE
        for (const bf of oldBound) {
          if (!checkedFamUserIds.includes(bf.userId)) {
            await apiFetch('/api/family-members/' + bf.id, { method: 'DELETE' });
          }
        }

        // 同步医生绑定（仅当医生选择有变化时）
        const oldRelations = await apiFetch('/api/elder-doctor?elderId=' + elderId).then(r => r.code === 200 ? r.data : []);
        const currentDoctorId = oldRelations.length > 0 ? oldRelations[0].doctorId : null;
        const newDoctorId = selectedDoctorId ? Number(selectedDoctorId) : null;
        if (currentDoctorId !== newDoctorId) {
            for (const r of oldRelations) {
                await apiFetch('/api/elder-doctor?elderId=' + elderId + '&doctorId=' + r.doctorId, { method: 'DELETE' });
            }
            if (newDoctorId) {
                await apiFetch('/api/elder-doctor', { method: 'POST', body: JSON.stringify({ elderId, doctorId: newDoctorId }) });
            }
        }
      }
    }
    // 编辑家属时同步关联老人（由后端 PUT /api/users 处理 payload.elderIds）
    if (editId && role === 'family') {
      // 后端 updateUser 已通过 payload.elderIds 处理多老人绑定
    }
    // ==== 在 hideModal 销毁 DOM 前捕获复选框值，供日志使用 ====
    let logFamNames = '';
    let logDocName = '';
    let logElderNames = '';
    if (role === 'family') {
      const elderCbs = document.querySelectorAll('#form-elder-list input[type="checkbox"]:checked');
      logElderNames = Array.from(elderCbs).map(cb => cb.parentElement.textContent.trim()).join('、') || '无';
    } else if (role === 'elder') {
      const famCbs = document.querySelectorAll('#form-family-list input[type="checkbox"]:checked');
      logFamNames = Array.from(famCbs).map(cb => cb.parentElement.textContent.trim()).join('、') || '无';
      const docSel = document.getElementById('form-doctor');
      logDocName = docSel?.options[docSel.selectedIndex]?.text || '无';
    }
    hideModal();
    loadUsers();
    // 写操作日志
    try {
      const user = UserAuth.getCurrentUser();
      const roleMap = { elder:'老人', family:'家属', doctor:'医生', admin:'管理员' };
      const roleDesc = roleMap[role] || role;
      let detail = '';
      if (role === 'family') {
        detail = ` → 关联老人: ${logElderNames}`;
      } else if (role === 'elder') {
        detail = ` 家属=${logFamNames} 医生=${logDocName}`;
      }
      await apiFetch('/api/admin/logs', { method: 'POST', body: JSON.stringify({
        operator: user?.username || 'admin',
        operation: (editId ? '编辑' : '新增') + `${roleDesc}账号: ${name}${detail}`
      }) });
    } catch(e) { console.warn('写日志失败', e); }
  } catch (err) {
    alert((editId ? '更新' : '创建') + '失败: ' + (err.message || err));
  }
});

// ==================== 编辑用户 ====================
async function openEdit(userId) {
  try {
    const res = await apiFetch('/api/users/' + userId);
    if (!res || res.code !== 200) throw new Error(res?.message || '获取用户信息失败');
    const u = res.data;
    document.getElementById('form-edit-id').value = u.id;
    document.getElementById('form-role').value = u.userType;
    document.getElementById('form-name').value = u.name || '';
    document.getElementById('form-username').value = u.username || '';
    document.getElementById('form-phone').value = u.phone || '';
    document.getElementById('form-password').value = '';
    document.getElementById('modal-title').textContent = '编辑用户';
    document.getElementById('btn-submit').textContent = '保存修改';
    document.getElementById('pwd-required').classList.add('hidden');
    document.getElementById('form-password').required = false;
    await renderAdditionalFields(u.userType);
    // 编辑家属时预选当前关联的老人（多选）
    if (u.userType === 'family') {
      try {
        const famRes = await apiFetch('/api/family-members');
        if (famRes.code === 200) {
          const myBindings = famRes.data.filter(f => f.userId === u.id);
          const elderCheckboxes = document.querySelectorAll('#form-elder-list input[type="checkbox"]');
          elderCheckboxes.forEach(cb => {
            if (myBindings.some(b => b.elderId === Number(cb.value))) {
              cb.checked = true;
            }
          });
        }
      } catch(e) { console.warn('加载家属关联失败', e); }
    }
    // 编辑老人时预选当前绑定的家属和医生（多选）
    if (u.userType === 'elder') {
      try {
        const elderRes = await apiFetch('/api/elders');
        if (elderRes.code === 200) {
          const elder = elderRes.data.find(e => e.userId === u.id);
          if (elder) {
            document.getElementById('form-elder-id').value = elder.id;
            // 预选家属（多选）
            const famRes = await apiFetch('/api/family-members');
            if (famRes.code === 200) {
              const boundFams = famRes.data.filter(f => f.elderId === elder.id);
              const famCheckboxes = document.querySelectorAll('#form-family-list input[type="checkbox"]');
              famCheckboxes.forEach(cb => {
                if (boundFams.some(b => b.userId === Number(cb.value))) {
                  cb.checked = true;
                }
              });
            }
            // 预选医生
            const docRelRes = await apiFetch('/api/elder-doctor?elderId=' + elder.id);
            if (docRelRes.code === 200 && docRelRes.data.length > 0) {
              document.getElementById('form-doctor').value = docRelRes.data[0].doctorId;
            }
          }
        }
      } catch(e) { console.warn('加载关系失败', e); }
    }
    showModal();
  } catch (err) {
    alert('加载用户信息失败: ' + (err.message || err));
  }
}

// ==================== 删除用户 ====================
let deleteUserId = null;
function openDelete(userId, username) {
  deleteUserId = userId;
  document.getElementById('delete-username').textContent = username;
  showDeleteModal();
}

document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
  if (!deleteUserId) return;
  try {
    const res = await apiFetch('/api/users/' + deleteUserId, { method: 'DELETE' });
    if (!res || res.code !== 200) throw new Error(res?.message || '删除失败');
    hideDeleteModal();
    loadUsers();
    // 写操作日志
    try {
      const user = UserAuth.getCurrentUser();
      const delUser = document.getElementById('delete-username').textContent;
      await apiFetch('/api/admin/logs', { method: 'POST', body: JSON.stringify({
        operator: user?.username || 'admin',
        operation: `删除用户: ${delUser}`
      }) });
    } catch(e) { console.warn('写日志失败', e); }
  } catch (err) {
    alert('删除失败: ' + (err.message || err));
  }
});

// ==================== 按钮事件 ====================
document.getElementById('btn-add-user').addEventListener('click', () => {
  resetForm();
  renderAdditionalFields('elder');
  showModal();
});
document.getElementById('btn-close-modal').addEventListener('click', hideModal);
document.getElementById('btn-cancel').addEventListener('click', hideModal);
document.getElementById('btn-cancel-delete').addEventListener('click', hideDeleteModal);

// 点击遮罩关闭
modal.addEventListener('click', e => { if (e.target === modal) hideModal(); });
deleteModal.addEventListener('click', e => { if (e.target === deleteModal) hideDeleteModal(); });

// ==================== 页面初始化 ====================
window.addEventListener('DOMContentLoaded', () => {
  UserAuth.requireAuth(['admin']);
  loadUsers();
});
</script>
