<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>用户关系配对管理 - 管理后台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<script src="../js/auth.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen overflow-hidden">
<!-- 侧边导航（简化，保留风格一致性） -->
<aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0">
  <div class="p-6 flex items-center gap-3">
    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-100">
      <iconify-icon class="text-2xl" icon="solar:health-bold"></iconify-icon>
    </div>
    <div class="flex flex-col leading-tight">
      <span class="text-lg font-bold text-slate-800">多银龄守护系统</span>
      <span class="text-xs font-semibold text-blue-600">管理员中心</span>
    </div>
  </div>
  <nav class="flex-1 px-4 space-y-1 overflow-y-auto mt-4">
    <div class="pt-8 pb-4">
      <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">系统管理</p>
    </div>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-800 rounded-xl transition-all" href="admin_user_management.html">
      <iconify-icon class="text-xl" icon="solar:users-group-rounded-bold"></iconify-icon>
      <span>用户管理</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-xl font-bold" href="admin_user_pairs.html">
      <iconify-icon class="text-xl" icon="solar:link-bold"></iconify-icon>
      <span>用户关系配对</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-800 rounded-xl transition-all" href="admin_operation_logs.html">
      <iconify-icon class="text-xl" icon="solar:document-bold"></iconify-icon>
      <span>系统操作日志</span>
    </a>
  </nav>
  <div class="p-4 border-t border-slate-100">
    <a class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition-all" href="#" onclick="UserAuth.logout(); return false;">
      <iconify-icon class="text-xl" icon="solar:logout-bold"></iconify-icon>
      <span class="font-semibold">退出系统</span>
    </a>
  </div>
</aside>
<main class="flex-1 overflow-y-auto">
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-100 px-8 py-4 flex items-center justify-between">
    <h2 class="text-xl font-bold">用户关系配对管理</h2>
    <div class="flex items-center gap-4">
      <button class="px-4 py-2 bg-blue-600 text-white rounded-xl" onclick="location.href='admin_add_user.html'">新增用户</button>
    </div>
  </header>
  <div class="p-8 space-y-6">
    <section class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <input id="pairs-search-input" class="px-3 py-2 border rounded-lg w-64" placeholder="搜索老人姓名" />
          <button id="pairs-search-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">搜索</button>
          <button id="pairs-search-clear" class="px-4 py-2 border rounded-lg hover:bg-slate-50 text-sm hidden">显示全部</button>
        </div>
        <div class="text-sm text-slate-500">变更会同步三端权限与消息路由</div>
      </div>
      <div id="pairs-table" class="overflow-x-auto">
        <!-- 表格由 JS 渲染 -->
      </div>
      <!-- 分页 -->
      <div id="pairs-pagination" class="hidden flex items-center justify-between px-3 py-3 border-t border-slate-100 bg-slate-50 text-sm mt-3">
        <div class="text-slate-500">共 <span id="pairs-total">0</span> 位老人</div>
        <div class="flex items-center gap-2">
          <button id="pairs-prev" class="px-3 py-1 rounded-lg border hover:bg-white disabled:opacity-40 disabled:cursor-not-allowed" disabled>上一页</button>
          <span class="text-slate-600">第 <span id="pairs-current">1</span> / <span id="pairs-total-pages">1</span> 页</span>
          <button id="pairs-next" class="px-3 py-1 rounded-lg border hover:bg-white disabled:opacity-40 disabled:cursor-not-allowed" disabled>下一页</button>
          <select id="pairs-page-size" class="ml-2 px-2 py-1 border rounded-lg text-xs">
            <option value="10">10条/页</option>
            <option value="20">20条/页</option>
            <option value="50">50条/页</option>
          </select>
        </div>
      </div>
      <div class="mt-4 text-right text-[12px] text-slate-500">提示：绑定/解绑后系统会自动写入操作日志并广播变更。</div>
    </section>
  </div>
</main>

<!-- 绑定弹窗 -->
<div id="bind-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center">
  <div class="bg-white w-[720px] rounded-2xl p-6">
    <h3 class="text-lg font-bold mb-3">编辑绑定关系</h3>
    <form id="bind-form" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-slate-500">老人</label>
          <div id="bind-elder" class="mt-1 font-bold"></div>
        </div>
    <div>
        <label class="text-sm text-slate-500">选择家属（可多选）</label>
        <div id="bind-family-list" class="mt-1 max-h-48 overflow-y-auto border rounded-lg p-2 space-y-1">
          <!-- 复选框由 JS 渲染 -->
        </div>
    </div>
      </div>
      <div>
        <label class="text-sm text-slate-500">选择医生</label>
        <select id="bind-doctor" class="w-full px-3 py-2 border rounded-lg mt-1"></select>
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" class="px-4 py-2 rounded-xl" onclick="closeBindModal()">取消</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-xl">保存绑定</button>
      </div>
    </form>
  </div>
</div>

<script>
  // 使用 BroadcastChannel 在多个标签页间广播变更（浏览器支持时）
  const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('admin_channel') : null;

  let elders = [];
  let filteredElders = [];
  let families = [];
  let doctors = [];
  let pairsPage = 1;
  let pairsPageSize = 10;

  const API_BASE = 'http://localhost:8080';
  function apiFetch(url, options){
    const opts = Object.assign({}, options);
    if (!opts.method || opts.method === 'GET') {
      opts.headers = Object.assign({}, opts.headers);
    } else {
      opts.headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers);
    }
    return fetch(API_BASE + url, opts).then(r=>r.json());
  }

  // 欢迎弹窗（仅显示一次）
  function showWelcome(){
    if(sessionStorage.getItem('admin_welcome_shown')) return;
    const modal = document.createElement('div');
    modal.className = 'fixed inset-0 flex items-center justify-center bg-black/40 z-50';
    modal.innerHTML = `<div class="bg-white p-6 rounded-2xl max-w-lg text-center">
      <h3 class="text-xl font-bold mb-2">欢迎，管理员</h3>
      <p class="text-sm text-slate-600 mb-4">在这里可以管理用户关系、查看日志与新增账号。</p>
      <button class="px-4 py-2 bg-blue-600 text-white rounded-xl" id="welcome-ok">开始使用</button>
    </div>`;
    document.body.appendChild(modal);
    document.getElementById('welcome-ok').addEventListener('click', ()=>{ sessionStorage.setItem('admin_welcome_shown','1'); modal.remove(); });
  }

  function loadData(){
    apiFetch('/api/admin/users')
      .then(res => {
        if(res.code !== 200) throw new Error(res.message || '获取用户数据失败');
        elders = res.data.elders || [];
        families = res.data.families || [];
        doctors = res.data.doctors || [];
        filteredElders = elders;
        pairsPage = 1;
        document.getElementById('pairs-search-input').value = '';
        document.getElementById('pairs-search-clear').classList.add('hidden');
        renderTable();
      }).catch(err => alert('加载失败: ' + err.message));
  }

  function renderTable(){
    const container = document.getElementById('pairs-table');
    const pagination = document.getElementById('pairs-pagination');
    const data = filteredElders;
    const total = data.length;
    if (total === 0) {
      container.innerHTML = '<div class="text-center text-slate-400 py-12">暂无数据</div>';
      pagination.classList.add('hidden');
      return;
    }
    const start = (pairsPage - 1) * pairsPageSize;
    const pageElders = data.slice(start, start + pairsPageSize);
    const totalPages = Math.ceil(total / pairsPageSize);
    document.getElementById('pairs-total').textContent = total;
    document.getElementById('pairs-current').textContent = pairsPage;
    document.getElementById('pairs-total-pages').textContent = totalPages;
    document.getElementById('pairs-prev').disabled = pairsPage <= 1;
    document.getElementById('pairs-next').disabled = pairsPage >= totalPages;
    pagination.classList.remove('hidden');

    let html = `<table class="w-full text-left border-collapse">
      <thead>
        <tr class="text-sm text-slate-500 border-b"><th class="p-3">老人</th><th>家属</th><th>医生</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>`;
    for(const e of pageElders){
      const fams = families.filter(f=>f.elderId === e.elderId);
      const famHtml = fams.length ? fams.map(f=>f.name).join(' / ') : '<span class="text-slate-400">未绑定</span>';
      const relations = e.doctorRelations || [];
      const docHtml = relations.length ? relations.map(r=>{ const d = doctors.find(x=>x.id===r.doctorId); return d? d.name : r.doctorId; }).join(' / ') : '<span class="text-slate-400">未绑定</span>';
      const hasFam = fams.length > 0;
      const hasDoc = relations.length > 0;
      const status = hasFam && hasDoc
        ? '<span class="px-2 py-0.5 bg-green-50 text-green-600 rounded-full text-xs font-bold">已绑定</span>'
        : hasFam || hasDoc
          ? '<span class="px-2 py-0.5 bg-amber-50 text-amber-600 rounded-full text-xs font-bold">部分绑定</span>'
          : '<span class="px-2 py-0.5 bg-slate-50 text-slate-400 rounded-full text-xs font-bold">未绑定</span>';
      html += `<tr class="border-b hover:bg-slate-50"><td class="p-3 font-bold">${e.name}</td><td>${famHtml}</td><td>${docHtml}</td><td>${status}</td><td class="p-3"><button class="px-3 py-1 bg-blue-600 text-white rounded-xl" onclick="openBindModal(${e.elderId})">编辑</button> <button class="px-3 py-1 bg-red-50 text-red-600 rounded-xl" onclick="unbindAll(${e.elderId})">解绑</button></td></tr>`;
    }
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function doPairsSearch(){
    const keyword = document.getElementById('pairs-search-input').value.trim().toLowerCase();
    if (!keyword) {
      filteredElders = elders;
      document.getElementById('pairs-search-clear').classList.add('hidden');
    } else {
      filteredElders = elders.filter(e => {
        if (e.name.toLowerCase().includes(keyword)) return true;
        const fams = families.filter(f => f.elderId === e.elderId);
        if (fams.some(f => f.name.toLowerCase().includes(keyword))) return true;
        const relations = e.doctorRelations || [];
        return relations.some(r => {
          const doc = doctors.find(d => d.id === r.doctorId);
          return doc && doc.name.toLowerCase().includes(keyword);
        });
      });
      document.getElementById('pairs-search-clear').classList.remove('hidden');
    }
    pairsPage = 1;
    renderTable();
  }

  function clearPairsSearch(){
    document.getElementById('pairs-search-input').value = '';
    filteredElders = elders;
    document.getElementById('pairs-search-clear').classList.add('hidden');
    pairsPage = 1;
    renderTable();
  }

  function goToPairsPage(page) {
    const data = filteredElders;
    const totalPages = Math.ceil(data.length / pairsPageSize);
    if (page < 1 || page > totalPages) return;
    pairsPage = page;
    renderTable();
  }

  document.getElementById('pairs-search-btn').addEventListener('click', doPairsSearch);
  document.getElementById('pairs-search-clear').addEventListener('click', clearPairsSearch);
  document.getElementById('pairs-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doPairsSearch(); });
  document.getElementById('pairs-prev').addEventListener('click', () => goToPairsPage(pairsPage - 1));
  document.getElementById('pairs-next').addEventListener('click', () => goToPairsPage(pairsPage + 1));
  document.getElementById('pairs-page-size').addEventListener('change', function() {
    pairsPageSize = Number(this.value);
    pairsPage = 1;
    renderTable();
  });

  function openBindModal(elderId){
    const elder = elders.find(x=>x.elderId === elderId);
    if(!elder) return alert('未找到老人');
    document.getElementById('bind-elder').textContent = elder.name;

    // 家属：多选复选框（按 userId 去重）
    const famContainer = document.getElementById('bind-family-list');
    const uniqueFamilies = families.filter((f, i, arr) => arr.findIndex(x => x.userId === f.userId) === i);
    if (uniqueFamilies.length === 0) {
      famContainer.innerHTML = '<div class="text-slate-400 text-sm py-2">暂无家属用户</div>';
    } else {
      famContainer.innerHTML = uniqueFamilies.map(f => {
        const isBound = families.some(x => x.userId === f.userId && x.elderId === elderId);
        return `<label class="flex items-center gap-2 px-2 py-1 rounded hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" class="family-checkbox" value="${f.userId}" ${isBound ? 'checked' : ''}>
          <span>${f.name}</span>
        </label>`;
      }).join('');
    }

    const docSel = document.getElementById('bind-doctor');
    docSel.innerHTML = '<option value="">-- 清除医生绑定 --</option>' + doctors.map(d=>`<option value="${d.id}" ${ (elder.doctorRelations||[]).some(r=>r.doctorId===d.id) ? 'selected' : ''}>${d.name}</option>`).join('');

    document.getElementById('bind-form').onsubmit = async function(e){
      e.preventDefault();
      const selectedDoctorId = document.getElementById('bind-doctor').value || null;

      try{
        // 处理家属绑定/解绑（差异比较）
        const checkedUserIds = Array.from(document.querySelectorAll('.family-checkbox:checked')).map(cb => Number(cb.value));
        const boundToThisElder = families.filter(f => f.elderId === elderId);

        // 新勾选的且之前未绑定 → POST 创建新行
        for (const userId of checkedUserIds) {
          const alreadyBound = boundToThisElder.some(f => f.userId === userId);
          if (!alreadyBound) {
            const famPerson = families.find(f => f.userId === userId);
            if (famPerson) {
              const createRes = await apiFetch('/api/family-members', {
                method: 'POST',
                body: JSON.stringify({ userId, elderId, name: famPerson.name, phone: famPerson.phone || '' })
              });
              if (!createRes || createRes.code !== 200) throw new Error(createRes?.message || '家属绑定失败');
            }
          }
        }

        // 取消勾选的且之前已绑定 → DELETE 删除该行
        for (const boundFm of boundToThisElder) {
          if (!checkedUserIds.includes(boundFm.userId)) {
            await apiFetch('/api/family-members/' + boundFm.id, { method: 'DELETE' });
          }
        }

        // 处理医生绑定/解绑（仅当医生选择有变化时）
        const currentDoctorIds = (elder.doctorRelations || []).map(r => r.doctorId);
        const newDoctorId = selectedDoctorId ? Number(selectedDoctorId) : null;
        const hasDoctorChanged = newDoctorId === null
            ? currentDoctorIds.length > 0
            : !currentDoctorIds.includes(newDoctorId) || currentDoctorIds.length > 1;
        if (hasDoctorChanged) {
            const relations = elder.doctorRelations || [];
            for(const r of relations){ await apiFetch('/api/elder-doctor?elderId=' + elderId + '&doctorId=' + r.doctorId, { method: 'DELETE' }); }
            if (newDoctorId) {
                const docRes = await apiFetch('/api/elder-doctor', { method: 'POST', body: JSON.stringify({ elderId, doctorId: newDoctorId }) });
                if (!docRes || docRes.code !== 200) throw new Error(docRes?.message || '医生绑定失败');
            }
        }

        // 写操作日志
        const user = UserAuth.getCurrentUser();
        const checkedNames = checkedUserIds.map(uid => { const p = families.find(f=>f.userId===uid); return p ? p.name : uid; }).join('、') || '无';
        const docName = selectedDoctorId ? (doctors.find(d => d.id === Number(selectedDoctorId))?.name || selectedDoctorId) : '无';
        await apiFetch('/api/admin/logs', { method: 'POST', body: JSON.stringify({ operator: user.username || 'admin', operation: `修改绑定: ${elder.name} 家属=${checkedNames} 医生=${docName}` }) });

        broadcast({type:'userPairUpdate', data:{elderId}});
        closeBindModal();
        loadData();
      }catch(err){ alert('保存失败: ' + (err.message||err)); }
    };

    document.getElementById('bind-modal').classList.remove('hidden');
    document.getElementById('bind-modal').classList.add('flex');
  }

  function closeBindModal(){
    document.getElementById('bind-modal').classList.add('hidden');
    document.getElementById('bind-modal').classList.remove('flex');
  }

  async function unbindAll(elderId){
    if(!confirm('确认解绑该老人所有关系？')) return;
    try{
      // 清理家属（删除所有绑定此老人的 family_member 行）
      const bound = families.filter(f=>f.elderId === elderId);
      for(const b of bound){ await apiFetch('/api/family-members/' + b.id, { method: 'DELETE' }); }
      // 清理医生
      const elderObj = elders.find(x=>x.elderId === elderId);
      const relations = elderObj?.doctorRelations || [];
      for(const r of relations){ await apiFetch('/api/elder-doctor?elderId=' + elderId + '&doctorId=' + r.doctorId, { method: 'DELETE' }); }

      const user = UserAuth.getCurrentUser();
      const elderName = elderObj?.name || elderId;
      const famNames = bound.length ? bound.map(f => f.name).join('、') : '无';
      const docNames = relations.length ? relations.map(r => { const d = doctors.find(x => x.id === r.doctorId); return d ? d.name : r.doctorId; }).join('、') : '无';
      await apiFetch('/api/admin/logs', { method: 'POST', body: JSON.stringify({ operator: user.username||'admin', operation: `解绑: ${elderName} 家属=${famNames} 医生=${docNames}` }) });
      broadcast({type:'userPairUpdate', data:{elderId}});
      loadData();
    }catch(err){ alert('解绑失败: ' + (err.message||err)); }
  }

  function broadcast(msg){ try{ if(channel) channel.postMessage(msg); } catch(e){} }

  // 初始化
  window.addEventListener('DOMContentLoaded', ()=>{
    UserAuth.requireAuth(['admin']);
    loadData();
    showWelcome();
  });
</script>
</body>
</html>
