<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>医生登录 - 多银龄守护</title>
    <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
    <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
</head>
<body class="min-h-screen flex">
    <!-- 左侧背景 -->
    <div class="w-1/2 bg-gradient-to-br from-[#1e40af] to-[#1e3a8a] flex flex-col justify-center items-center text-white p-12">
        <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center mb-6">
            <iconify-icon class="text-4xl" icon="solar:medical-kit-bold"></iconify-icon>
        </div>
        <h1 class="text-4xl font-black mb-4">多银龄守护</h1>
        <p class="text-white/70 text-center">
            社区医生端<br/>
            智能监护 · 快速响应 · 全程守护
        </p>
        <div class="mt-12 flex gap-8">
            <div class="text-center">
                <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <iconify-icon class="text-xl" icon="solar:heart-bold"></iconify-icon>
                </div>
                <p class="text-xs text-white/60">实时监测</p>
            </div>
            <div class="text-center">
                <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <iconify-icon class="text-xl" icon="solar:shield-check-bold"></iconify-icon>
                </div>
                <p class="text-xs text-white/60">智能研判</p>
            </div>
            <div class="text-center">
                <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mx-auto mb-2">
                    <iconify-icon class="text-xl" icon="solar:alarm-ring-bold"></iconify-icon>
                </div>
                <p class="text-xs text-white/60">应急响应</p>
            </div>
        </div>
    </div>
    <!-- 右侧登录表单 -->
    <div class="w-1/2 flex flex-col justify-center items-center p-12 bg-slate-50">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-800">医生登录</h2>
                <p class="text-slate-500 text-sm mt-2">请输入您的账号信息</p>
            </div>
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">用户名</label>
                    <div class="relative">
                        <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" icon="solar:user-circle-bold"></iconify-icon>
                        <input type="text" id="username" class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="请输入用户名" value="doctor1"/>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">密码</label>
                    <div class="relative">
                        <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" icon="solar:lock-bold"></iconify-icon>
                        <input type="password" id="password" class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="请输入密码" value="123456"/>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                    <iconify-icon icon="solar:login-bold"></iconify-icon>
                    登录
                </button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-xs text-slate-400">
                    登录即表示您同意我们的服务条款和隐私政策
                </p>
            </div>
        </div>
    </div>
    <script>
        // 重定向到统一登录页，登录后会自动跳转到医生工作站
        window.location.href = '../login.html';
    </script>
</body>
</html>
