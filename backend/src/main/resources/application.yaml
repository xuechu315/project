server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: elderly-care-system

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/elderly_care_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis:
  type-aliases-package: com.elderly.care.entity
  configuration:
    map-underscore-to-camel-case: true