<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - 多银龄守护</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">
<div class="max-w-4xl w-full flex bg-white rounded-2xl shadow-2xl overflow-hidden m-4">
<!-- 左侧展示区 -->
<div class="hidden md:flex md:w-1/2 bg-blue-600 p-12 text-white flex-col justify-between">
<div>
<div class="flex items-center gap-2 mb-8">
<iconify-icon class="text-4xl" icon="solar:health-bold"></iconify-icon>
<span class="text-2xl font-bold tracking-tight">多银龄守护</span>
</div>
<h1 class="text-3xl font-bold mb-4 leading-tight">智慧监护，<br/>多智能体协同守护。</h1>
<p class="text-blue-100 leading-relaxed">基于 CrewAI 框架，集成健康监测、行为分析、冲突解决与应急响应，为老人提供全天候的安全保障。</p>
</div>

</div>
<!-- 右侧表单区 -->
<div class="w-full md:w-1/2 p-8 md:p-12">
<div class="mb-8">
<h2 class="text-2xl font-bold text-slate-800">欢迎登录</h2>
<p class="text-slate-500 mt-1">请输入您的账号信息</p>
</div>

<form class="space-y-5" onsubmit="return false;">
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5">账号 / 手机号</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<iconify-icon icon="solar:user-circle-bold"></iconify-icon>
</span>
<input class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="请输入您的账号" type="text" id="username" value="admin_test"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5">登录密码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<iconify-icon icon="solar:lock-password-bold"></iconify-icon>
</span>
<input class="block w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="请输入密码" type="password" id="password" value="123456"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600">
<iconify-icon icon="solar:eye-bold"></iconify-icon>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" type="checkbox"/>
<span class="text-sm text-slate-500 group-hover:text-slate-700">记住我</span>
</label>
<a class="text-sm font-semibold text-blue-600 hover:text-blue-700" href="#">忘记密码？</a>
</div>
<button class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 text-center transform transition-active active:scale-95" id="login-btn">
                    立即登录
                </button>
</form>
<div class="mt-8 pt-6 border-t border-slate-100 text-center">
<p class="text-sm text-slate-500">
                    还没有账号？ <a class="text-blue-600 font-bold hover:underline" href="#">联系管理员开通</a>
</p>
</div>
</div>
</div>
<script>

        // 登录按钮点击事件
        document.getElementById('login-btn').addEventListener('click', async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // 存储用户信息
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    
                    // 根据用户类型跳转到不同界面
                    if (data.user.user_type === 'admin') {
                        // 管理员跳转到管理员首页
                        window.location.href = 'admin_index.html';
                    } else if (data.user.user_type === 'family') {
                        // 家属跳转到家属端首页
                        window.location.href = 'family_index.html';
                    } else if (data.user.user_type === 'doctor') {
                        // 医生跳转到医生工作站
                        window.location.href = 'doctor_dashboard.html';
                    } else {
                        // 老人用户跳转到老人首页
                        window.location.href = 'elderly_index.html';
                    }
                } else {
                    alert(data.message || '登录失败');
                }
            } catch (error) {
                console.error('登录失败:', error);
                alert('登录失败，请检查网络连接');
            }
        });
    </script>
</body>
</html>
